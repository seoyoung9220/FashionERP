/* 레이아웃: 팀 피그마(FOLD) 6개 화면 — 첫화면 로그인/회원가입 → 상단 탭 5개(홈·재고발주·불량·수익·반품). 숫자는 FastAPI 백엔드에서만 받고, 없으면 비워 둔다 */
:root{
  --bg:#F7F2E8; --bg2:#FAF5EB; --surface:#FFFCF5; --sunk:#F1E9DC; --ink:#2E241C; --ink2:#5C4F44; --muted:#968676; --line:#E3D6C3;
  --accent:#A84B30; --accent-soft:#F4E0D7; --sage:#4F6B45; --sage-soft:#E1E8DA; --amber:#C27D35; --amber-soft:#F6E8D3;
  --brown:#6E5438; --beige:#E8D6BA; --blue-soft:#E6E9FA; --blue:#4A55C2; --card-white:#FFFFFF;
  --f-logo:"Cormorant Garamond","Times New Roman",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1713; --bg2:#201A15; --surface:#28201A; --sunk:#30271F; --ink:#F2E8DB; --ink2:#D0C2B2; --muted:#A49482; --line:#3D3229;
  --accent:#E07D5F; --accent-soft:#4A2B21; --sage:#95B587; --sage-soft:#28331F; --amber:#E2A762; --amber-soft:#3E2F1B;
  --brown:#B08A63; --beige:#5A4936; --blue-soft:#272B45; --blue:#9AA3F0; --card-white:#28201A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1713; --bg2:#201A15; --surface:#28201A; --sunk:#30271F; --ink:#F2E8DB; --ink2:#D0C2B2; --muted:#A49482; --line:#3D3229;
  --accent:#E07D5F; --accent-soft:#4A2B21; --sage:#95B587; --sage-soft:#28331F; --amber:#E2A762; --amber-soft:#3E2F1B;
  --brown:#B08A63; --beige:#5A4936; --blue-soft:#272B45; --blue:#9AA3F0; --card-white:#28201A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg2);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
.wrap{max-width:1372px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.muted{color:var(--muted)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.lcard{width:100%;max-width:390px;background:var(--card-white);border-radius:64px;padding:64px 40px 56px;box-shadow:0 20px 50px rgba(60,40,20,.12)}
.ltabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:28px}
.ltabs button{background:none;border:0;padding:10px 0;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.ltabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brown)}
.lcard h2{font-size:26px;font-weight:800}
.lcard .lead{color:var(--ink2);font-size:13.5px;margin:6px 0 20px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:15px}
.field .in{position:relative}
.field input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px}
.field input[aria-invalid="true"]{border-color:var(--accent)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;display:grid}
.lrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2);margin:4px 0 18px;gap:8px;flex-wrap:wrap}
.lrow label{display:flex;gap:6px;align-items:center;cursor:pointer}
.lrow a{color:var(--ink2);text-decoration:none}
.lbtn{width:100%;border:0;border-radius:10px;padding:13px;background:var(--brown);color:#FFF9F1;font-weight:600;font-size:15.5px;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sbtn{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:10px;display:flex;gap:8px;justify-content:center;align-items:center}
.sbtn .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800}
.err{color:var(--accent);font-size:12.5px;min-height:18px;margin:-4px 0 8px}
.devbtn{width:100%;margin-top:14px;border:1.5px dashed var(--brown);border-radius:10px;padding:11px;background:transparent;color:var(--brown);font-weight:700;font-size:13.5px;cursor:pointer}
.devbtn:hover{background:var(--sunk)}
.devtag{font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:1px 6px}
.demo-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px}
@media (max-width:860px){.login{grid-template-columns:minmax(0,1fr)}.login .photo{min-height:260px}.login .photo h1{top:auto;bottom:24px;left:max(16px,env(safe-area-inset-left,0px));font-size:28px}.lcard{border-radius:36px;padding:40px 22px}}

/* ───── 상단바 ───── */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:73px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:18px;text-decoration:none;color:var(--ink)}
.logo b{font-family:var(--f-logo);font-size:28px;font-weight:600;letter-spacing:.01em}
.logo small{font-size:10px;letter-spacing:.04em;color:var(--ink2)}
nav.tabs{display:flex;gap:6px;margin:0 auto;overflow-x:auto;max-width:100%}
nav.tabs a{padding:24px 22px 22px;border-bottom:2px solid transparent;color:var(--ink);text-decoration:none;white-space:nowrap;font-size:14px}
nav.tabs a[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
.me{position:relative}
.me>button{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;color:var(--ink2)}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.08);z-index:12}
.menu div{padding:8px 10px;font-size:12px;color:var(--muted)}
.menu button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.menu button:hover{background:var(--sunk)}
@media (max-width:900px){.top .wrap{padding-block:10px}nav.tabs{order:3;width:100%;margin:0}nav.tabs a{padding:10px 14px}}

/* ───── 화면 공통 ───── */
.hero{position:relative;overflow:hidden;background:var(--beige) center/cover no-repeat;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,25,15,.55) 0%,rgba(40,25,15,.25) 45%,rgba(40,25,15,0) 75%)}
.hero.light{color:var(--ink)} .hero.light::after{background:linear-gradient(90deg,rgba(247,238,225,.92) 0%,rgba(247,238,225,.75) 40%,rgba(247,238,225,0) 70%)}
.hero.plain{background:var(--amber-soft);color:var(--ink)} .hero.plain::after{display:none}
.hero .wrap{position:relative;z-index:1;padding-block:20px 22px;min-height:186px;display:grid;align-content:center}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-size:clamp(26px,3vw,34px);line-height:1.2;margin-top:4px;font-weight:700;max-width:14em}
.hero p{margin:8px 0 0;font-size:13.5px;opacity:.92}
main .wrap{padding-block:22px 64px;display:grid;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 22px;min-width:0}
.card.round{border-radius:22px}
.gi .card.round{border-radius:10px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gm{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.gh{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.gi{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.gm,.gh,.gi{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.g4,.g5,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.g4,.g5,.g3{grid-template-columns:minmax(0,1fr)}}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sh h2{font-size:21px;font-weight:700;margin-top:4px}
.sh .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.blk{display:grid;gap:14px;align-content:start}

.kpi .l{font-size:11.5px;color:var(--ink2)}
.kpi{padding:16px 18px}
.kpi .v{font-size:28px;font-weight:600;margin:8px 0 6px;line-height:1.15}
.kpi .s{font-size:11.5px;color:var(--ink2)}
.kpi.red .v,.kpi.red .s{color:var(--accent)}
.kpi.bar{border-left:3px solid var(--accent)} .kpi.bar.g{border-left-color:var(--sage)} .kpi.bar.n{border-left-color:var(--beige)}
.blank{color:var(--muted)!important;font-weight:400}
.empty{border:1px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--bg2)}

async function api(path, opts){
  if (SNAPMODE) {
    if (path.startsWith("/api/returns/analyze")) return SNAP.data.analyze;
    if (opts && opts.method && opts.method !== "GET") throw new Error("스냅샷 보기에서는 저장할 수 없어요. 내 컴퓨터에서 실행하면 저장돼요.");

const CAT_LABEL = {top:"상의/셔츠", pants:"하의/치마 · 바지", skirt:"하의/치마 · 치마", outer:"아우터", etc:"의류"};
function catKind(item){
  const name = item.product_name || "", c = item.category || "";
  if (/스커트|치마/.test(name)) return "skirt";
  if (c.startsWith("하의") || /팬츠|바지|슬랙스|청바지|데님 진/.test(name)) return "pants";
  if (c.startsWith("아우터") || /코트|자켓|재킷|점퍼|패딩|베스트|가디건|집업|블레이저/.test(name)) return "outer";
  if (c.startsWith("상의") || /셔츠|티셔츠|맨투맨|스웨트|블라우스|니트|후드티/.test(name)) return "top";
  return "etc";
}
function productThumb(item, px = 44){
  const style = `width:${px}px;height:${px}px${px !== 44 ? ";margin:0" : ""}`;
  const src = item && (item.image_url || item.image);
  if (src) return `<span class="pthumb" style="${style}"><img src="${esc(src)}" alt="${esc(item.product_name)} 상품 사진" loading="lazy"></span>`;
  const k = item ? catKind(item) : "etc", label = `${CAT_LABEL[k]} 기본 이미지 (실제 상품 사진 아님)`;
  return `<span class="pthumb" style="${style}" role="img" aria-label="${label}" title="${label}">${CAT_ICON[k]}</span>`;
}

  document.getElementById("lbody").innerHTML = `<form id="sf" novalidate>

  SNAPMODE = false;
  try { const r = await fetch(BASE + "/health", {cache:"no-store"}); LIVE = r.ok; } catch { LIVE = false; }
  if (!LIVE && SNAP) { SNAPMODE = true; LIVE = true; }
  Object.keys(cache).forEach(k => delete cache[k]);
  const c = document.getElementById("conn"); if (!c) return;
  c.dataset.s = SNAPMODE ? "snap" : LIVE ? "live" : "off";
  const preview = location.protocol === "https:" && /localhost|127\.0\.0\.1/.test(BASE);
  FAILS.clear(); showFails();

/* 홈 하단 '새 주문 입력' → POST /api/sales (CSV 업로드와 같은 검증 규칙, 1건 추가) */
async function orderForm(){
  const f = document.getElementById("ordf"), msg = document.getElementById("ordmsg"); if (!f) return;
  const say = (t, bad) => { msg.textContent = t; msg.style.color = bad ? "var(--accent)" : "var(--sage)"; };
  const btn = f.querySelector("button");
  f.is_returned.onchange = () => f.querySelectorAll("[data-ret]").forEach(el => el.hidden = !f.is_returned.checked);
  if (!LIVE || SNAPMODE) { [...f.elements].forEach(el => el.disabled = true); say(SNAPMODE ? "스냅샷 보기에서는 입력할 수 없어요. 내 컴퓨터 서버(http://localhost:8000)에서 입력해 주세요." : "백엔드에 연결되면 입력할 수 있어요.", true); return; }
  const [inv, d] = await Promise.all([safe(get("/api/inventory")), safe(get("/api/dashboard"))]);
  (inv?.items || []).forEach(i => f.product_id.insertAdjacentHTML("beforeend", `<option value="${esc(i.product_id)}">${esc(i.product_name)} (${esc(i.product_id)})</option>`));
  const t = new Date(); f.date.value = new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  f.onsubmit = async e => {
    e.preventDefault();
    const body = {date: f.date.value, product_id: f.product_id.value, size: f.size.value.trim(), color: f.color.value.trim(),
                  is_returned: f.is_returned.checked, return_type_code: f.return_type_code.value, return_detail_text: f.return_detail_text.value.trim()};
    const miss = [["date","주문일"],["product_id","상품"],["size","사이즈"],["color","색상"]].filter(([k]) => !body[k]).map(([, l]) => l);
    if (miss.length) return say(`${miss.join(", ")}을(를) 입력해 주세요.`, true);
    btn.disabled = true; say("저장하는 중…");
    try {
      const r = await fetch(BASE + "/api/sales", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { const det = (j?.error?.details || []).map(x => `${x.column}: ${x.message}`).join(" · "); throw new Error((j?.error?.message || `저장 실패 (${r.status})`) + (det ? " — " + det : "")); }
      Object.keys(cache).forEach(k => delete cache[k]);
      toast(`주문 ${j.order.order_id} 추가됨`);
      await home();
      const m2 = document.getElementById("ordmsg");
      if (m2) { m2.textContent = `저장됨: ${j.order.order_id} · ${j.order.product_name} ${j.order.size}/${j.order.color}${j.return_id ? " · 반품 " + j.return_id : ""}${j.warnings?.length ? " · 확인: " + j.warnings.map(w => w.message).join(", ") : ""}`; m2.style.color = "var(--sage)"; }
    } catch (err) { say(err.message, true); btn.disabled = false; }
  };
}

function topRise(mo){
  const c = (mo?.items || []).filter(i => i.change_pct != null && i.change > 0).sort((a, b) => b.change_pct - a.change_pct || b.change - a.change);
  return c[0] || null;
}
function drawDaily(r){
  const box = document.getElementById("wk"), foot = document.getElementById("wkf"); if (!box) return;
  if (!r.ok) { box.innerHTML = ERRBOX(r.e); return; }
  const it = r.d.items || [];
  if (!it.length || it.every(x => x.net_sales == null)) { box.innerHTML = empty(NODATA(), "기간 안에 주문 데이터가 없습니다."); return; }
  const W = 520, H = 190, top = 22, bot = 32, ch = H - top - bot, mx = Math.max(1, ...it.map(x => x.net_sales || 0)), step = W / it.length, bw = Math.min(44, step * 0.55);
  const wdK = ["일","월","화","수","목","금","토"]; let g = "";
  for (let i = 0; i < 4; i++) g += `<line x1="0" x2="${W}" y1="${top + i * ch / 3}" y2="${top + i * ch / 3}" stroke="var(--beige)"/>`;
  it.forEach((x, i) => {
    const cx = step * i + step / 2, dt = new Date(x.date + "T00:00:00Z"), lab = `${dt.getUTCMonth() + 1}/${dt.getUTCDate()}(${wdK[dt.getUTCDay()]})`;
    g += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="10" fill="var(--muted)">${lab}</text>`;
    if (x.net_sales == null) { g += `<text x="${cx}" y="${top + ch - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">—</text>`; return; }
    const h = Math.max(1, x.net_sales / mx * ch), y = top + ch - h;
    g += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" fill="var(--accent)"><title>${x.date} 순매출 ${won(x.net_sales)} · 주문 ${x.order_count}건 · 반품 ${x.return_count}건</title></rect>`;
    g += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">${fmt(Math.round(x.net_sales / 10000))}</text>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(r.d.period.from)}부터 ${esc(r.d.period.to)}까지 일별 순매출 막대 그래프">${g}</svg>`;
  const t = r.d.total || {};
  foot.innerHTML = `<div class="small muted">${esc(r.d.period.from)} ~ ${esc(r.d.period.to)} 합계 순매출 <b>${won(t.net_sales)}</b> (총매출 ${won(t.gross_sales)} · 주문 ${qty(t.order_count, "건")}) · 막대 위 숫자는 만 원(반올림), 정확한 금액은 막대에 마우스를 올리면 보여요.</div>`
    + basisBox("일별 산출 근거 (순매출 = 총매출 − 반품 금액)", it.map(x => [`${x.date}: ${x.formula}`, x.inputs]));
}

  };
  ["q","st","need"].forEach(id => document.getElementById(id)[id === "q" ? "oninput" : "onchange"] = () => { pageNo = 0; draw(); });
  if (!items.find(i => i.product_id === sel)) sel = (items.find(i => (rmap[i.product_id]?.final_order_qty || 0) > 0) || items[0]).product_id;
  draw(); recPanel(items.find(i => i.product_id === sel), rmap[sel]);
}
function recPanel(i, r){
  const el = document.getElementById("rec"); const inp = r?.inputs || {};
  const q = i ? (qtyOverride[i.product_id] ?? r?.final_order_qty ?? 0) : null;
  el.innerHTML = `<div><h2 style="font-size:21px">AI 발주 추천</h2><div class="sub small muted">선택한 상품의 발주 수량과 근거를 확인하세요.</div></div>
    <div class="pr">${productThumb(i, 62)}<div><b style="font-size:15px">${i ? esc(i.product_name) : "상품을 선택하세요"}</b>${i && isIllustration(i) ? '<span class="illtag">기본 이미지</span>' : ""}<div class="small muted">${i ? `${i.product_id} · 리드타임 ${i.lead_time_days ?? "—"}일 · MOQ ${inp.moq ?? "—"}개` : "—"}</div></div></div>
    <div class="qbox"><div><div class="small">권장 발주량</div><div class="big num">${q == null ? B : fmt(q) + "개"}</div></div>
      <div style="text-align:right"><div class="step"><button type="button" id="qm" aria-label="줄이기" ${!i ? "disabled" : ""}>−</button><input id="qv" type="number" min="0" value="${q ?? ""}" aria-label="발주 수량" ${!i ? "disabled" : ""}><button type="button" id="qp" aria-label="늘리기" ${!i ? "disabled" : ""}>+</button></div>
      <div class="small muted" style="margin-top:6px">${r ? `목표 커버 ${inp.target_cover_days ?? "—"}일 기준` : "—"}</div></div></div>
    <div class="mini"><div><div class="l">현재 재고</div><div class="v num">${i ? fmt(i.stock_qty) + "개" : B}</div></div><div><div class="l">재고 소진 예상일</div><div class="v num" style="color:var(--accent)">${i?.days_to_stockout != null ? "약 " + i.days_to_stockout + "일" : B}</div></div><div><div class="l">최근 7일 판매량</div><div class="v num">${i ? fmt(i.inputs?.orders_in_window) + "개" : B}</div></div></div>
    <details class="basis" ${i ? "open" : ""}><summary>산출 근거 접기 / 펼치기</summary>
      ${i ? `<dl class="kv"><dt>하루 평균 판매량</dt><dd>${inp.avg_daily_sales ?? "—"}개</dd><dt>리드타임 + 목표 일수</dt><dd>${inp.lead_time_days ?? "—"} + ${inp.target_cover_days ?? "—"}일</dd><dt>상품 평균 불량률</dt><dd>${inp.defect_rate_pct ?? "—"}%</dd><dt>현재 재고</dt><dd>${fmt(i.stock_qty)}개</dd></dl>
        <div class="formula num">${esc(r?.formula || "—")}</div>${(r?.notes || []).map(n => `<div class="small muted" style="margin-top:6px">※ ${esc(n.message)}</div>`).join("")}`
        : `<div class="small muted" style="margin-top:8px">${NODATA()} · 상품을 선택하면 계산식이 나옵니다.</div>`}</details>
    <div class="btns"><button class="btn ghost" id="addRev" type="button" ${!i || !LIVE ? "disabled" : ""}>발주 검토 목록에 추가</button><button class="btn" type="button" disabled title="실제 발주 기능은 아직 범위 밖입니다">발주하기 (준비 중)</button></div>`;
  if (!i) return;
  const setQ = v => { qtyOverride[i.product_id] = Math.max(0, v | 0); recPanel(i, r); };
  document.getElementById("qm").onclick = () => setQ(q - (inp.moq || 1));
  document.getElementById("qp").onclick = () => setQ(q + (inp.moq || 1));
  document.getElementById("qv").onchange = e => setQ(+e.target.value);
  document.getElementById("addRev").onclick = async () => {
    try { await send("/api/tasks", {product_id:i.product_id, title:`${i.product_name} ${q}개 발주 검토`, type:"PRODUCT_FIX", source:{type:"MANUAL", ref:i.product_id}}); toast("개선 업무 목록에 추가했습니다"); }
    catch (e) { toast(e.message); }
  };
}

function trendSvg(list){
  const W = 820, H = 230, L = 36, Bt = 50, T = 26, R = 8, max = list.length ? Math.max(12, Math.ceil(Math.max(...list.map(x => x.defect_rate_pct)) / 4) * 4) : 12;
  const y = v => T + (H - T - Bt) * (1 - v / max); let g = "";
  for (let v = 0; v <= max; v += max / 3) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink2)">${Math.round(v)}%</text>`;
  if (!list.length) g += `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="12" fill="var(--muted)">${NODATA()}</text>`;
  const bw = (W - L - R) / Math.max(list.length, 1);
  list.forEach((x, i) => { const cx = L + bw * i + bw / 2, w = Math.min(28, bw * .5), t = y(x.defect_rate_pct);
    g += `<rect x="${cx-w/2}" y="${t}" width="${w}" height="${y(0)-t}" fill="${x.is_spike ? "var(--accent)" : "var(--beige)"}"><title>${esc(x.po_id)} ${pct(x.defect_rate_pct)}</title></rect>`;
    if (x.is_spike) g += `<text x="${cx}" y="${t-7}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">${pct(x.defect_rate_pct)}</text>`;
    g += `<text x="${cx}" y="${H-Bt+18}" text-anchor="middle" font-size="10" fill="var(--ink)">${esc((x.product_name||"").split(" ").pop())}</text><text x="${cx}" y="${H-Bt+34}" text-anchor="middle" font-size="9.5" fill="var(--ink2)">${(x.received_at||"").slice(5).replace("-",".")}</text>`; });
  return `<div class="tbl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="생산분별 불량률 막대 그래프" style="min-width:520px;width:100%;height:auto;display:block">${g}</svg></div>`;
}
async function kanban(){
  const el = document.getElementById("kanban"); if (!el) return;
  delete cache["/api/tasks"];
  const t = LIVE ? await safe(get("/api/tasks")) : null; const items = t?.items || [];
  const NEXT = {PENDING:"IN_PROGRESS", ON_HOLD:"IN_PROGRESS", IN_PROGRESS:"DONE"};
  el.innerHTML = [["PENDING","해야 할 일","var(--amber)"],["IN_PROGRESS","진행 중","var(--accent)"],["DONE","완료","var(--sage)"]].map(([c, l, col]) => {
    const list = items.filter(x => x.status === c || (c === "PENDING" && x.status === "ON_HOLD"));
    return `<div class="col"><h3><i style="background:${col}"></i>${l}${list.length ? ` <span class="small muted">${list.length}</span>` : ""}</h3>
      ${list.map(x => `<div class="task"><b>${esc(x.title)}</b><span>${esc(x.product_name || x.product_id)} · ${esc(x.type_label || x.type)}${x.assignee ? " · " + esc(x.assignee) : ""}</span>
        ${NEXT[x.status] ? `<button type="button" data-id="${x.task_id}" data-n="${NEXT[x.status]}">${NEXT[x.status] === "DONE" ? "완료로" : "진행 중으로"} →</button>` : ""}</div>`).join("") || `<div class="small muted" style="padding-top:14px">${LIVE ? "업무 없음" : "데이터 연결 전"}</div>`}</div>`; }).join("");
  el.querySelectorAll("button[data-id]").forEach(b => b.onclick = async () => { try { await send(`/api/tasks/${b.dataset.id}`, {status:b.dataset.n}, "PATCH"); kanban(); } catch (e) { toast(e.message); } });
}

    <main><div class="wrap">
    <div class="sh" style="align-items:center"><div class="tools" style="align-items:center"><span class="small muted">분석 기간</span><select class="sel" id="pk"><option value="30">최근 30일</option><option value="all">전체 기간</option></select><span class="small muted" id="pr"></span></div><span class="small muted">단위: 원</span></div>
    <section class="grid g4" id="pk4">${kpi("총 매출",B,"주문 수 × 판매가","bar")}${kpi("추정 기여이익",B,"순매출 − 원가 − 수수료 − 변동비 − 불량 손실","bar g")}${kpi("기여이익률",B,"추정 기여이익 ÷ 순매출","bar n")}${kpi("판매 주문 수",B,"주문 1건 = 1장 가정","bar n")}</section>

        <div id="mtr">${LIVE ? LOADING : empty(NODATA(), NODESC)}</div></section>
      <section class="card round blk"><div><div class="eyebrow">PRODUCT PROFITABILITY</div><h2 style="font-size:21px;margin-top:4px">상품별 수익성</h2><div class="sub small muted">추정 기여이익이 큰 상품 TOP 4</div></div><div class="blk" id="pbars">${empty(NODATA(), NODESC)}</div></section>
    </div>
    <div class="grid gh">
      <section class="card round blk"><div><div class="eyebrow">REVENUE MIX</div><h2 style="font-size:21px;margin-top:4px">카테고리별 매출 비중</h2><div class="sub small muted">매출 구성과 이익률을 함께 확인해요.</div></div>
        <div id="cmix" class="blk" style="gap:10px">${LIVE ? LOADING : empty(NODATA(), NODESC)}</div></section>
      <section class="card round blk"><div><div class="eyebrow">BUSINESS INSIGHT</div><h2 style="font-size:21px;margin-top:4px">수익 확인 포인트</h2></div><div id="pins"><div class="signal"><small>CHECK</small><div style="font-weight:700;margin-top:4px">—</div></div><p class="small muted">${NODATA()}</p></div></section>
    </div></div></main>`);
  const s = document.getElementById("pk"); s.value = pKind; s.onchange = () => { pKind = s.value; profit(); };
  if (!LIVE) return;
  const pr = await period(pKind); const d = pr ? await safe(get(`/api/profit?from=${pr.from}&to=${pr.to}`)) : null;
  if (pr) document.getElementById("pr").textContent = periodText(pr);
  const [mr, cr] = await Promise.all([load("/api/profit/monthly"), pr ? load(`/api/profit/categories?from=${pr.from}&to=${pr.to}`) : Promise.resolve({ok:false, e:"기준일을 불러오지 못했어요"})]);
  drawMonthly(mr); drawCats(cr);
  if (!has(d)) return;
  const it = d.items, sum = k => it.reduce((a, x) => a + (x[k] || 0), 0), net = sum("net_sales"), m = sum("contribution_margin");
  document.getElementById("pk4").innerHTML = kpi("총 매출", wonKrH(sum("gross_sales")), "주문 수 × 판매가 (정가 가정)", "bar") +
    kpi("추정 기여이익", wonKrH(m), "순매출 − 원가 − 수수료 − 변동비 − 불량 손실", "bar g") +
    kpi("기여이익률", net ? (Math.round(m / net * 1000) / 10).toFixed(1) + "%" : B, "추정 기여이익 ÷ 순매출", "bar n") +
    kpi("판매 주문 수", qty(it.reduce((a, x) => a + (x.inputs?.sold_order_count || 0), 0), "건"), "주문 1건 = 1장 가정", "bar n");
  const top = [...it].sort((a, b) => b.contribution_margin - a.contribution_margin).slice(0, 4), mx = Math.max(1, ...top.map(x => Math.abs(x.contribution_margin)));
  const cols = ["var(--accent)","var(--beige)","var(--sage)","var(--beige)"];
  document.getElementById("pbars").innerHTML = top.map((x, i) => `<div class="hbar"><div class="t"><span>${esc(x.product_name)}</span><span class="num">${wonKrH(x.contribution_margin)}</span></div><div class="tr"><i style="width:${Math.abs(x.contribution_margin) / mx * 100}%;background:${x.is_negative ? "var(--accent)" : cols[i]}"></i></div><small>${pct(x.contribution_margin_pct)} 기여이익률 · <span class="num">${esc(x.formula || "")}</span></small></div>`).join("");
  const neg = it.filter(x => x.is_negative), miss = it.filter(x => x.missing_costs.length);
  document.getElementById("pins").innerHTML = (neg.length || miss.length)
    ? `<div class="signal"><small style="color:var(--accent)">CHECK</small><div style="font-weight:700;margin-top:4px">${neg.length ? `추정 기여이익이 음수인 상품 ${neg.length}개` : "비용이 일부 비어 있는 상품이 있어요"}</div></div>
      ${neg.map(x => `<p class="small" style="margin:0"><b>${esc(x.product_name)}</b> ${won(x.contribution_margin)} · <span class="muted">${esc(x.formula)}</span></p>`).join("")}
      ${miss.map(x => `<p class="small muted" style="margin:0">${esc(x.product_name)}: ${x.missing_costs.join(", ")} 미입력 → 계산에서 빠져 실제보다 높게 보일 수 있어요.</p>`).join("")}`
    : `<div class="signal"><small>GOOD SIGNAL</small><div style="font-weight:700;margin-top:4px">적자 상품이 없어요.</div></div>`;
}
function drawMonthly(r){
  const box = document.getElementById("mtr"); if (!box) return;
  if (!r.ok) { box.innerHTML = ERRBOX(r.e); return; }
  const all = r.d.items || [], it = all.slice(-6);
  if (!it.length) { box.innerHTML = empty(NODATA(), "월별로 집계할 주문 데이터가 없습니다."); return; }
  const W = 800, H = 220, L = 52, top = 16, bot = 34, ch = H - top - bot;
  const vals = it.flatMap(x => [x.net_sales, x.contribution_margin_excl_ad]).filter(v => v != null);
  const mx = Math.max(1, ...vals), mn = Math.min(0, ...vals), span = mx - mn, Y = v => top + (mx - v) / span * ch;
  const step = (W - L) / it.length, bw = Math.min(34, step * 0.28); let g = "";
  for (let i = 0; i <= 3; i++) { const v = mx - span * i / 3; g += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--ink2)">${fmt(Math.round(v / 10000))}만</text>`; }
  it.forEach((x, i) => {
    const cx = L + step * i + step / 2, mm = Number(x.month.slice(5)) + "월" + (x.partial ? "*" : "");
    g += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${mm}</text>`;
    [[x.net_sales, "var(--accent)", -bw - 2, "순매출"], [x.contribution_margin_excl_ad, "var(--beige)", 2, "추정 기여이익(광고비 제외)"]].forEach(([v, c, dx, nm]) => {
      if (v == null) { g += `<text x="${cx + dx + bw / 2}" y="${Y(0) - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">—</text>`; return; }
      const y = Math.min(Y(v), Y(0)), h = Math.max(1, Math.abs(Y(v) - Y(0)));
      g += `<rect x="${cx + dx}" y="${y}" width="${bw}" height="${h}" fill="${c}"${x.partial ? ' opacity=".55"' : ""}><title>${x.month}${x.partial ? ` (${x.from}~${x.to}, 일부 기간)` : ""} ${nm} ${won(v)}</title></rect>`;
    });
  });
  const t = r.d.total || {}, part = it.filter(x => x.partial).map(x => `${x.month}(${x.from.slice(5)}~${x.to.slice(5)})`);
  box.innerHTML = `<div class="tbl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${it.length}개월 순매출과 추정 기여이익(광고비 제외) 막대 그래프" style="min-width:480px;width:100%;height:auto;display:block">${g}</svg></div>

function donut(parts, total){
  const R = 82, r = 52, C = 100; let a = -Math.PI / 2, g = "";
  if (!total) g = `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="var(--sunk)" stroke-width="${R-r}"/>`;
  parts.forEach(([code, v]) => { const da = v.count / total * Math.PI * 2, a2 = a + da, big = da > Math.PI ? 1 : 0, P = (an, rd) => `${C + rd * Math.cos(an)} ${C + rd * Math.sin(an)}`;
    g += parts.length === 1 ? `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${REASON_COLOR[code]}" stroke-width="${R-r}"/>`
      : `<path d="M ${P(a,R)} A ${R} ${R} 0 ${big} 1 ${P(a2,R)} L ${P(a2,r)} A ${r} ${r} 0 ${big} 0 ${P(a,r)} Z" fill="${REASON_COLOR[code] || "var(--muted)"}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(v.label)} ${v.count}건</title></path>`; a = a2; });
  return `<h2 style="font-size:21px;margin:4px 0 10px">반품 이유</h2><div class="donut"><svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="반품 사유 비중">${g}<text x="100" y="104" text-anchor="middle" font-size="28" font-weight="700" fill="${total ? "var(--ink)" : "var(--muted)"}">${total || "—"}</text><text x="100" y="124" text-anchor="middle" font-size="11" fill="var(--ink2)">반품 건수</text></svg>
    <div class="lg">${parts.length ? parts.map(([c, v]) => `<div><i style="background:${REASON_COLOR[c] || "var(--muted)"}"></i>${esc(v.label)}<span class="num">${(Math.round(v.count / total * 1000) / 10).toFixed(1)}%</span></div>`).join("") : `<div class="small muted">${NODATA()}</div>`}</div></div>`;
}
/* ───── 리뷰 키워드 자동 분류 (GET /api/returns/review-keywords) ───── */
const KW_COLOR = {SIZE_FIT:"#3F4BC9", QUALITY:"#B9473A", FABRIC:"#3E8B78", COLOR:"#D29440", DESIGN:"#8B5CC5", SHIPPING:"#7A6A5A", CHANGE_OF_MIND:"#A8ABBE", UNCLASSIFIED:"#B8AC9C"};
const kwPill = (code, label) => `<span class="pill" style="background:color-mix(in srgb, ${KW_COLOR[code] || "#999"} 16%, transparent);color:var(--ink)"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${KW_COLOR[code] || "#999"};margin-right:6px"></i>${esc(label)}</span>`;
function highlight(text, words){
  let h = esc(text);
  [...new Set(words)].sort((a, b) => b.length - a.length).forEach(w => { h = h.split(esc(w)).join(`<mark style="background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px">${esc(w)}</mark>`); });
  return h;
}
async function loadKeywords(pid, products){

  const path = "/api/returns/review-keywords" + (q.toString() ? "?" + q : "");
  const tb = document.getElementById("kwTable"); if (!tb) return;
  let r;
  try { r = await get(path); }
  catch (e) { tb.innerHTML = `<tr><td colspan="3">${empty("리뷰 분석을 불러오지 못했습니다", e.message)}</td></tr>`; return; }
  const name = id => (products.find(p => p.product_id === id) || {}).product_name || id;
  if (!r.analyzed_count) {
    tb.innerHTML = `<tr><td colspan="3">${empty("분석할 리뷰가 없습니다", "선택한 기간·상품에 반품 리뷰가 없어요.")}</td></tr>`;
    document.getElementById("kwCats").innerHTML = ""; document.getElementById("kwNote").textContent = ""; return;
  }
  const s = r.sample_review;
  document.getElementById("kwReview").innerHTML = `<div class="eyebrow" style="color:var(--ink2)">CUSTOMER REVIEW</div>
    <div class="small muted" style="margin-top:6px">${s ? `${esc(name(s.product_id))} · 반품 리뷰 · 주문 ${esc(s.order_id)}` : "—"}</div>
    <p style="font-weight:700;font-size:17px;line-height:1.6">${s ? "“" + highlight(s.text, s.matches.map(m => m.keyword)) + "”" : "키워드가 있는 리뷰가 없습니다"}</p>
    <div class="small muted" style="border-top:1px solid var(--line);padding-top:12px">${s ? `찾은 키워드 ${s.matches.length}개 → ${[...new Set(s.matches.map(m => m.category_label))].join(", ")} · 가장 많은 유형의 실제 리뷰 원문` : ""}</div>`;
  tb.innerHTML = r.top_keywords.slice(0, 6).map(k => `<tr><td><b>“${esc(k.keyword)}”</b></td><td>${kwPill(k.category, k.category_label)}</td><td class="num">${qty(k.count, "건")} 언급 · ${pct(k.share_pct)}</td></tr>`).join("")
    || `<tr><td colspan="3">${empty("찾은 키워드가 없습니다")}</td></tr>`;
  const max = Math.max(1, ...r.categories.map(c => c.count));
  document.getElementById("kwCats").innerHTML = `<div class="small" style="font-weight:600">분류별 리뷰 수 (리뷰 ${qty(r.analyzed_count, "건")} 기준)</div>` +
    r.categories.map(c => `<div class="hbar"><div class="t" style="font-weight:500"><span>${kwPill(c.code, c.label)}</span><span class="num">${qty(c.count, "건")} · ${pct(c.share_pct)}</span></div><div class="tr"><i style="width:${c.count / max * 100}%;background:${KW_COLOR[c.code] || "var(--muted)"}"></i></div></div>`).join("");
  const design = r.reason_code_cross.find(x => x.reason_code === "CHANGE_OF_MIND" && x.category === "DESIGN");
  document.getElementById("kwNote").innerHTML = [
    `기간 ${esc(r.period.from)} ~ ${esc(r.period.to)}${pid ? " · " + esc(name(pid)) : " · 전체 상품"} · 분류됨 ${qty(r.classified_count, "건")}, 분류 불가 ${qty(r.unclassified_count, "건")} (원인을 말하지 않는 리뷰는 억지로 나누지 않아요)`,
    r.multi_label_count ? `한 리뷰에 여러 유형이 있으면 각 유형에 1건씩 세요 (${qty(r.multi_label_count, "건")}). 그래서 비율 합계가 100%를 넘어요.`
      : "한 리뷰에 여러 유형이 있으면 각 유형에 1건씩 세는데, 이번 결과에는 그런 리뷰가 없어 비율 합계가 100%예요.",
    design ? `고객이 '단순 변심'을 고른 리뷰 중 ${qty(design.count, "건")}은 실물·디자인 느낌을 이유로 들었어요.` : "",
    ...(r.notes || []).map(n => "※ " + esc(n.message)),
  ].filter(Boolean).join("<br>");
}

const enumLabel = (group, code, fallback) => (ENUMS[group] && ENUMS[group][code]) || fallback || code || "—";

function aiView(r, p, all = []){

  document.getElementById("vt").textContent = `${shown?.product_name || r.product_id} · 자주 나온 불만`;
  const other = p && r.product_id && r.product_id !== p.product_id;

  const src = r.fallback
    ? `<div class="fb">AI 호출에 실패해 준비된 예시 분석(<b>fallback: true</b>)을 보여주고 있어요. 서버 .env에 API 키를 넣고 다시 켜면 실시간 분석이 나옵니다.${other ? `<br><b>선택하신 「${esc(p.product_name)}」의 분석이 아니라 ${esc(shown?.product_name || r.product_id)}(${esc(r.period?.from || "")} ~ ${esc(r.period?.to || "")}) 예시입니다.</b>` : ""}</div>`
    : `<div class="small" style="color:var(--sage)">● 실시간 AI 분석 결과 (fallback: false)</div>`;
  // insufficient_data: 실패가 아니라 "판단하기에 데이터가 부족함" — 원인·개선안이 비어 있는 것이 정상입니다
  const insuff = r.insufficient_data
    ? `<div class="fb" style="background:var(--sunk)"><b>판단하기에 데이터가 부족해요.</b> 분석한 반품 ${qty(r.analyzed_count, "건")}만으로는 원인과 개선안을 단정하지 않습니다. 아래의 관측 사실과 '확인할 항목'만 참고해 주세요.</div>` : "";
  document.getElementById("ai").innerHTML = `${src}${insuff}
    <div class="small muted" style="text-align:right">분석 ${r.analyzed_count == null ? "—" : qty(r.analyzed_count, "건")} · 기간 ${esc(r.period?.from || "—")} ~ ${esc(r.period?.to || "—")}</div>
    ${cats.map((c, i) => `<div class="row"><div class="t"><span>${esc(enumLabel("return_reasons", c.code, c.label))}</span><span class="small num" style="font-weight:400">${qty(c.count, "건")} · ${pct(c.share_pct)}</span></div><div class="tr"><i style="width:${c.share_pct ?? 0}%;background:${REASON_COLOR[c.code] || colors[i % colors.length]}"></i></div></div>`).join("")}
    ${(r.observed_facts || []).length ? `<div class="fact"><b>관측된 사실</b></div>` : ""}
    ${(r.observed_facts || []).map(f => `<div class="fact"><span>${esc(f.statement)}</span>${(f.evidence_quotes || []).map(q => `<div class="quote">“${esc(q)}”</div>`).join("")}</div>`).join("")}
    ${(r.possible_causes || []).length ? `<div class="fact"><b>가능한 원인</b>${r.possible_causes.map(c => `<div class="small">${esc(c.statement)} <span class="pill" style="padding:1px 8px">확신도 ${esc(enumLabel("confidence", c.confidence, c.confidence))}</span></div>`).join("")}</div>`
      : r.insufficient_data ? `<div class="fact"><b>가능한 원인</b><span class="small muted">데이터 부족으로 제시하지 않음</span></div>` : ""}
    ${r.cross_check?.statement ? `<div class="fact"><b>입고 검수와 교차 확인</b><span class="small">${esc(r.cross_check.statement)} <span class="pill" style="padding:1px 8px">확신도 ${esc(enumLabel("confidence", r.cross_check.confidence, r.cross_check.confidence))}</span></span></div>` : ""}
    ${(r.checks_needed || []).length ? `<div class="fact"><b>추가로 확인할 항목</b><ul class="small" style="margin:0;padding-left:18px">${r.checks_needed.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
    ${(r.improvement_checklist || []).length ? `<div class="fact"><b>개선 체크리스트</b>${r.improvement_checklist.map((c, i) => `<div style="display:flex;gap:10px;justify-content:space-between;align-items:start"><span class="small"><span class="pill ${c.type === "PRODUCT_FIX" ? "bad" : "warn"}" style="padding:2px 8px">${esc(enumLabel("checklist_type", c.type, c.type))}</span> ${esc(c.title)}</span><button class="btn ghost" type="button" data-i="${i}" style="padding:5px 10px">업무로 추가</button></div>`).join("")}</div>`
      : r.insufficient_data ? `<div class="fact"><b>개선 체크리스트</b><span class="small muted">데이터 부족으로 제시하지 않음</span></div>` : ""}
    ${(r.notes || []).map(n => `<div class="small muted">※ ${esc(n.message)}</div>`).join("")}`;
  document.querySelectorAll("#ai [data-i]").forEach(b => b.onclick = async () => { const c = r.improvement_checklist[b.dataset.i];
    try { await send("/api/tasks", {product_id:r.product_id, title:c.title, type:c.type, source:{type:"RETURN_ANALYSIS", ref:r.product_id}}); b.disabled = true; b.textContent = "추가됨"; } catch (e) { toast(e.message); } });
  const sz = (r.size_color_findings || []).filter(s => s.dimension === "size");
  if (sz.length) { document.getElementById("sizes").innerHTML = sz.map(s => `<div><b>${esc(s.value)}</b>${qty(s.count, "건")}</div>`).join(""); document.getElementById("sizeNote").textContent = "반품 건수 기준 분포입니다 (사이즈별 전체 주문 수가 없어 반품률은 아님)."; }
}

// 개발자용 바로가기: 주소 끝에 ?dev=1 을 붙이면 로그인 없이 개발자 모드로 들어갑니다
if (!USER && new URLSearchParams(location.search).has("dev")) devEnter();
else { render(); if (USER) connect(); }
})();
</script>

</body></html>
